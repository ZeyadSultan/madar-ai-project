<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400;1,8..60,600&display=swap">
<style>
html,body{margin:0;background:#0B1029}
*{box-sizing:border-box}
a{color:#8FE0CF}
a:hover{color:#EAF0FF}
</style>
</helmet>
<section data-screen-label="Logo" style="width: 2400px; padding: 80px 80px 40px; background: #0B1029; color: #D5DAF7; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; gap: 32px;">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #E27A4E;">Madar AI · Logo</span>
    <h1 style="margin: 0; font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 56px; letter-spacing: -0.02em; color: #EAF0FF;">The logo and its colours</h1>
  </div>
  <div style="display: grid; grid-template-columns: 1.3fr 1.3fr 1fr; gap: 24px;">
    <div style="display: flex; flex-direction: column; border: 1px solid #2A3363; border-radius: 12px; overflow: hidden;">
      <div style="height: 340px; display: grid; place-items: center; background: #0B1029;"><img src="assets/madar-logo-dark-bg.svg" alt="Madar logo on dark" style="width: 440px; height: auto;"></div>
      <div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 20px 24px; background: #0E1533; border-top: 1px solid #2A3363;">
        <sc-for list="{{ darkChips }}" as="c" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 10px;"><span style="width: 28px; height: 28px; border-radius: 999px; background: {{ c.hex }}; border: 1px solid #3A4586;"></span><span style="display: flex; flex-direction: column;"><span style="font-size: 14px; color: #EAF0FF;">{{ c.role }}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9AA3D0;">{{ c.hex }}</span></span></div>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; border: 1px solid #2A3363; border-radius: 12px; overflow: hidden;">
      <div style="height: 340px; display: grid; place-items: center; background: #FBF7F1;"><img src="assets/madar-logo-light-bg.svg" alt="Madar logo on light" style="width: 440px; height: auto;"></div>
      <div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 20px 24px; background: #0E1533; border-top: 1px solid #2A3363;">
        <sc-for list="{{ lightChips }}" as="c" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 10px;"><span style="width: 28px; height: 28px; border-radius: 999px; background: {{ c.hex }}; border: 1px solid #3A4586;"></span><span style="display: flex; flex-direction: column;"><span style="font-size: 14px; color: #EAF0FF;">{{ c.role }}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9AA3D0;">{{ c.hex }}</span></span></div>
        </sc-for>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #2A3363; border-radius: 12px; overflow: hidden;">
      <div style="display: grid; place-items: center; background: #0B1029;"><img src="assets/madar-mark-dark-bg.svg" alt="Madar mark on dark" width="120" height="120"></div>
      <div style="display: grid; place-items: center; background: #FBF7F1;"><img src="assets/madar-mark-light-bg.svg" alt="Madar mark on light" width="120" height="120"></div>
    </div>
  </div>
</section>

<section data-screen-label="Palette" style="width: 2400px; padding: 72px 80px 120px; background: #0B1029; color: #D5DAF7; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; gap: 32px;">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #E27A4E;">Product palette · 1c</span>
    <h2 style="margin: 0; font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 48px; letter-spacing: -0.02em; color: #EAF0FF;">Indigo night with Madar accents</h2>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
    <sc-for list="{{ themes }}" as="o" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <span style="font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 28px; color: #EAF0FF;">{{ o.name }}</span>
        <div style="display: grid; grid-template-columns: repeat(8, 1fr); border: 1px solid #2A3363; border-radius: 12px; overflow: hidden;">
          <sc-for list="{{ o.sw }}" as="s" hint-placeholder-count="8">
            <div style="display: flex; flex-direction: column;"><div style="height: 64px; background: {{ s.hex }}; border-bottom: 1px solid #2A3363;"></div><div style="padding: 8px 10px; background: #0E1533; display: flex; flex-direction: column;"><span style="font-size: 12px; color: #EAF0FF;">{{ s.role }}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9AA3D0;">{{ s.hex }}</span></div></div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 1100px; height: 856px; border: 1px solid #2A3363; border-radius: 12px; overflow: hidden;"><div style="width: 1440px; height: 1120px; transform: scale(0.7639); transform-origin: 0 0;"><dc-import name="Madar AI Prototype" screen="landing" frame-h="100%" frame-w="{{ 1440 }}" hint-size="1440px,1120px" style="width: 100%; height: 100%;"></dc-import></div></div>
      <div style="width: 1100px; height: 688px; border: 1px solid #2A3363; border-radius: 12px; overflow: hidden;"><div style="width: 1440px; height: 900px; transform: scale(0.7639); transform-origin: 0 0;"><dc-import name="Madar AI Prototype" screen="chat" preset="two" source-open="{{ true }}" frame-h="100%" frame-w="{{ 1440 }}" hint-size="1440px,900px" style="width: 100%; height: 100%;"></dc-import></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 1100px; height: 856px; border: 1px solid #2A3363; border-radius: 12px; overflow: hidden;"><div style="width: 1440px; height: 1120px; transform: scale(0.7639); transform-origin: 0 0;"><dc-import name="Madar AI Prototype" theme="light" screen="landing" frame-h="100%" frame-w="{{ 1440 }}" hint-size="1440px,1120px" style="width: 100%; height: 100%;"></dc-import></div></div>
      <div style="width: 1100px; height: 688px; border: 1px solid #2A3363; border-radius: 12px; overflow: hidden;"><div style="width: 1440px; height: 900px; transform: scale(0.7639); transform-origin: 0 0;"><dc-import name="Madar AI Prototype" theme="light" screen="chat" preset="two" source-open="{{ true }}" frame-h="100%" frame-w="{{ 1440 }}" hint-size="1440px,900px" style="width: 100%; height: 100%;"></dc-import></div></div>
    </div>
  </div>
  <div style="display: flex; gap: 28px; font-size: 16px;">
    <a href="Madar AI Prototype.dc.html">Open the prototype</a>
    <a href="Madar AI Screens.dc.html">Screens</a>
    <a href="Madar AI Foundations.dc.html">Foundations</a>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const sw = a => a.map(([role, hex]) => ({ role, hex }));
    return {
      darkChips: sw([['Arc', '#8FE0CF'], ['Dot', '#E27A4E'], ['Word', '#FFFFFF'], ['Background', '#041714']]),
      lightChips: sw([['Arc', '#0F5C52'], ['Dot', '#D97048'], ['Word', '#221F1C'], ['Background', '#FBF7F1']]),
      themes: [
        { name: 'Dark (default)', sw: sw([['Page', '#0B1029'], ['Panel', '#0E1533'], ['Card', '#111838'], ['Border', '#2A3363'], ['Accent', '#8FE0CF'], ['Button', '#E27A4E'], ['Heading', '#EAF0FF'], ['Body', '#D5DAF7']]) },
        { name: 'Light', sw: sw([['Page', '#FBF7F1'], ['Panel', '#F4EEE5'], ['Card', '#FFFFFF'], ['Border', '#E8E0D5'], ['Accent', '#0F5C52'], ['Button', '#0F5C52'], ['CTA', '#D97048'], ['Heading', '#221F1C']]) }
      ]
    };
  }
}
</script>
</body>
</html>
